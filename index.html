<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nail Art by Ayesha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <h1>Nail Art by Ayesha</h1>
    <a href="https://instagram.com/YOUR_INSTAGRAM_USERNAME" target="_blank" class="insta-link">
      Instagram
    </a>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <img src="images/hero-1.jpg" alt="Nail design 1">
    <div class="hero-text">
      Get Your Nails Done
    </div>
    <img src="images/hero-2.jpg" alt="Nail design 2">
    <img src="images/hero-3.jpg" alt="Nail design 3">
  </section>

  <!-- PRICES SECTION -->
  <section class="prices">
    <h2>Nail Extensions & Prices</h2>

    <div class="price-grid">
      <div class="price-box">
        <h3>Gel Polish</h3>
        <p>₹599</p>
      </div>

      <div class="price-box">
        <h3>Gel X Extensions</h3>
        <p>₹1400 <br><span>(includes gel polish)</span></p>
      </div>

      <div class="price-box">
        <h3>Gel Extensions</h3>
        <p>₹1700 <br><span>(includes gel polish)</span></p>
      </div>

      <div class="price-box">
        <h3>Acrylic Extensions</h3>
        <p>₹1800 <br><span>(includes gel polish)</span></p>
      </div>

      <div class="price-box">
        <h3>Removal</h3>
        <p>₹600 <br><span>(price may vary)</span></p>
      </div>
    </div>

    <!-- SOLID COLOR IMAGES GO HERE -->
    <div class="solid-images">
    </div>

  </section>
  <h1 style="text-align:center; color:#d46a8c;">
  Nail Art by Ayesha
</h1>

<div style="display:flex; height:100vh;">
  <img src="images/hero-1.jpg" style="width:33.33%; object-fit:cover;">
  <img src="images/hero-2.jpg" style="width:33.33%; object-fit:cover;">
  <img src="images/hero-3.jpg" style="width:33.33%; object-fit:cover;">
</div>


</body>
</html>
